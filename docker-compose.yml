services:
  mariadb:
    image: mariadb:11
    container_name: larbi_mariadb_dev
    restart: unless-stopped
    environment:
      MARIADB_USER: larbi
      MARIADB_PASSWORD: larbi_dev_password
      MARIADB_DATABASE: larbi_dev
      MARIADB_ROOT_PASSWORD: larbi_root_dev_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mariadb_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: larbi_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: larbi
      POSTGRES_PASSWORD: larbi_dev_password
      POSTGRES_DB: larbi_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U larbi -d larbi_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
